name: Deploy www

on:
  push:
    branches: [main]
    paths:
      - 'apps/www/**'
      - 'design-tokens-build/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-www.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-www-prod
  cancel-in-progress: true

env:
  REGISTRY: vardeacr.azurecr.io

# Pushing the :latest tag triggers the ACR webhook `vardewwwprodcd`, which makes
# the App Service web app `varde-www-prod` pull the new image and restart.
# No Azure login needed — the ACR token below only has push rights to the www repo.
jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: acr login
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: build & push image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          target: www
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/www:${{ github.sha }}
            ${{ env.REGISTRY }}/www:latest
          build-args: |
            PORT=8000
            HOST=0.0.0.0
            APP_ENV=production
